name: Deploy Portal Sul Ma to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefix .
        working-directory: .

      - name: Generate static site
        run: node scripts/generate-site.js
        working-directory: .
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          SITE_DESCRIPTION: ${{ secrets.SITE_DESCRIPTION }}

      - name: Verify dist/ exists
        run: |
          ls -la dist/
          echo "Files in dist:"
          find dist -type f | head -30

      - name: Deploy to Hostinger via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=.git --exclude=.github
          path: dist/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
          remote_key_pass: ${{ secrets.HOSTINGER_SSH_KEY_PASS }}

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Site should be live at: ${{ secrets.SITE_URL }}"